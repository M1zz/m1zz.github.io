<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-itunes-app" content="app-clip-bundle-id=com.leeo.moa.Clip, app-clip-display=card">
  <title>모아</title>
  <style>
    :root { --ink: #10323a; --muted: #5b6f73; --bg: #f3f6f5; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e8f0ef; --muted: #9fb2b4; --bg: #0d1a1d; --card: #15262a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; padding: 24px 16px; }
    main { background: var(--card); border-radius: 20px; padding: 36px 28px; max-width: 26rem; width: 100%; text-align: center;
           box-shadow: 0 4px 20px rgba(0, 0, 0, .08); }
    .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; background: linear-gradient(#14606e, #f08a5d); }
    h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 12px; word-break: keep-all; }
    p { color: var(--muted); margin: 0 0 8px; word-break: keep-all; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1 id="title">사진 보내기</h1>
    <p>iPhone 카메라로 QR을 찍으면 앱 설치 없이 사진을 보낼 수 있어요.</p>
    <p>보내는 사람과 받는 사람이 같은 Wi-Fi에 있어야 해요.</p>
  </main>
  <script>
    const name = new URLSearchParams(location.search).get('name');
    if (name) document.getElementById('title').textContent = name + '에 사진 보내기';
  </script>
</body>
</html>
